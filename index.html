<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vocale</title>
<link rel="icon" type="image/png" href="/favicon-32x32.png" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<meta name="theme-color" content="#050505" />
<meta name="apple-mobile-web-app-title" content="Vocale" />
<meta name="application-name" content="Vocale" />
    <script>
      window.__appSplashStartedAt = performance.now();
    </script>
    <style>
      /* Hide scrollbars on mobile devices */
      @media (max-width: 768px) {
        html, body, #root {
          -ms-overflow-style: none;
          scrollbar-width: none;
          overflow: -moz-scrollbars-none;
        }
        
        html::-webkit-scrollbar,
        body::-webkit-scrollbar,
        #root::-webkit-scrollbar {
          display: none;
          -webkit-appearance: none;
          width: 0;
          height: 0;
        }
        
        /* Target all scrollable elements */
        * {
          -ms-overflow-style: none !important;
          scrollbar-width: none !important;
        }
        
        *::-webkit-scrollbar {
          display: none !important;
          -webkit-appearance: none !important;
          width: 0 !important;
          height: 0 !important;
        }
      }

      /* Slide animations for tab transitions */
      @keyframes slideLeft {
        from {
          transform: translateX(100%);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      @keyframes slideRight {
        from {
          transform: translateX(-100%);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      /* Slide-up animation for fullscreen player */
      @keyframes slideUp {
        from {
          transform: translateY(100%);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      /* Slide-down animation for fullscreen player close */
      @keyframes slideDown {
        from {
          transform: translateY(0);
          opacity: 1;
        }
        to {
          transform: translateY(100%);
          opacity: 0;
        }
      }

      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #050506;
        color: #fff;
        transition: opacity 420ms cubic-bezier(0.22, 1, 0.36, 1),
                    visibility 420ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      #app-splash.splash-hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        transform: translateY(8px);
        animation: splash-content-in 700ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      .splash-logo-img {
        width: 76px;
        height: 76px;
        border-radius: 22px;
        object-fit: cover;
        display: block;
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
        animation: splash-logo-soft 1400ms ease-in-out infinite;
      }

      .splash-title {
        margin-top: 20px;
        color: #ffffff;
        font-size: 36px;
        font-weight: 760;
        letter-spacing: -0.045em;
        line-height: 1;
        font-family: Inter, SF Pro Display, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .splash-subtitle {
        margin-top: 10px;
        color: rgba(255, 255, 255, 0.52);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-family: Inter, SF Pro Text, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        opacity: 0;
        animation: splash-subtitle-in 600ms cubic-bezier(0.22, 1, 0.36, 1) 260ms forwards;
      }

      @keyframes splash-content-in {
        from {
          opacity: 0;
          transform: translateY(14px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes splash-subtitle-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes splash-logo-soft {
        0%, 100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.018);
          opacity: 0.94;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-content,
        .splash-subtitle,
        .splash-logo-img {
          animation: none;
        }

        .splash-subtitle {
          opacity: 1;
        }

        #app-splash {
          transition: opacity 200ms ease;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-splash">
      <div class="splash-content">
        <img class="splash-logo-img" src="/apple-touch-icon.png" alt="Vocale" />
        <div class="splash-title">Vocale</div>
        <div class="splash-subtitle">Tuned for you.</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
